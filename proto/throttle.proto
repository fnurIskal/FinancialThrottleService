syntax = "proto3";

option csharp_namespace = "FinancialThrottle.Grpc";

package throttle;

service ThrottleService {
    rpc GetStatus (StatusRequest) returns (StatusResponse);
    rpc GetQueue (QueueRequest) returns (QueueResponse);
    rpc GetSuspended (SuspendedRequest) returns (SuspendedResponse);
    rpc RetryGroup (RetryGroupRequest) returns (RetryGroupResponse);
    rpc ForceSendGroup (ForceSendRequest) returns (ForceSendResponse);
    rpc StreamLogs (LogStreamRequest) returns (stream LogEntry);
}

// STATUS
message StatusRequest {}

message StatusResponse {
    bool   is_running           = 1;
    string last_heartbeat_utc   = 2;
    int32  queued_count         = 3;
    int32  suspended_count      = 4;
    int32  processed_this_cycle = 5;
    string worker_started_utc   = 6;
}

// QUEUE
message QueueRequest {}

message QueueResponse {
    repeated WaitingGroupMessage groups = 1;
}

message WaitingGroupMessage {
    string database_name  = 1;
    int32  security_id    = 2;
    int32  template_id    = 3;
    string security_code  = 4;
    double priority_score = 5;
    int32  item_count     = 6;
    repeated WaitingItemMessage items = 7;
    int32  order_type     = 8;
    string status         = 9;
}

message WaitingItemMessage {
    int32  quarter       = 1;
    bool   is_original   = 2;
    string username      = 3;
    int32  disclosure_id = 4;
}

// SUSPENDED
message SuspendedRequest {}

message SuspendedResponse {
    repeated SuspendedGroupMessage groups = 1;
}

message SuspendedGroupMessage {
    string database_name     = 1;
    int32  security_id       = 2;
    int32  template_id       = 3;
    string security_code     = 4;
    int32  failure_count     = 5;
    string first_failed_utc  = 6;
    string next_retry_utc    = 7;
    bool   retry_in_progress = 8;
}

// RETRY
message RetryGroupRequest {
    string database_name = 1;
    int32  security_id   = 2;
    int32  template_id   = 3;
}

message RetryGroupResponse {
    bool   success = 1;
    string message = 2;
}

// FORCE SEND
message ForceSendRequest {
    string database_name = 1;
    int32  security_id   = 2;
    int32  template_id   = 3;
}

message ForceSendResponse {
    bool   success = 1;
    string message = 2;
}

// LOGS
message LogStreamRequest {
    string date     = 1;
    string category = 2;
    string level    = 3;
}

message LogEntry {
    string timestamp    = 1;
    string level        = 2;
    string category     = 3;
    string message      = 4;
    string group_key    = 5;
    string security_code = 6;
    string exception    = 7;
}